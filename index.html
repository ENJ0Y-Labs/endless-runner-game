<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Relic Rush 3D is a three-lane endless runner built for Start.ng."
    />
    <meta name="theme-color" content="#1a110a" />
    <title>Relic Rush 3D</title>
  
<style>body[data-page="play"] > footer { display:none !important; }</style>
</head>
  <body>
    <div id="app"></div>
    <footer style="display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;padding:12px;background:#1a110a;color:#ffd37a;font:600 14px system-ui">
      <a href="https://start.ng" style="color:inherit">← Back to start.ng</a>
      <span>Play more on start.ng</span>
    </footer>
    <script src="./admin-config.js"></script>
    <script type="module" src="./src/router.js"></script>
    <script type="module">
      if (window.location.pathname.replace(/\\/+$/, "") === "/backyard") {
        import("./src/beta-feedback.js").then(({ mountBackyardFeedback }) => {
          const mount = () => {
            if (!document.querySelector(".game-shell")) return false;
            mountBackyardFeedback(document);
            return true;
          };
          if (!mount()) {
            const observer = new MutationObserver(() => {
              if (mount()) observer.disconnect();
            });
            observer.observe(document.body, { childList: true, subtree: true });
          }
        });
      }
    </script>
  </body>
</html>
