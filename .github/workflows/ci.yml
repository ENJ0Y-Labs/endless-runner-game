name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run gameplay configuration tests
        run: npm test

      - name: Build production game
        run: npm run build
        
      - name: Validate game with Start.ng
        env:
          START_GAME_NAME: Relic Rush 3D
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.start.ng/games/check \
            --header "Content-Type: application/json" \
            --data "{\"repo_url\":\"https://github.com/ENJ0Y-Labs/endless-runner-game\",\"name\":\"${START_GAME_NAME}\"}"
